разбиения работ названа основным документом управления содержанием."}, {"q": "Что такое окружение проекта?", "options": ["Только организационная структура команды", "Совокупность внешних и внутренних факторов, влияющих на достижение результатов проекта", "Только законодательство страны", "Только финансовые показатели проекта"], "answer": 1, "hint": "Окружение включает внешние и внутренние факторы, влияющие на результаты проекта."}, {"q": "Что в лекции понимается под дальним окружением проекта?", "options": ["Внутренняя среда проектной команды", "Внешнее окружение, не зависящее от конкретного предприятия", "Только заказчик проекта", "Только поставщики проекта"], "answer": 1, "hint": "Дальнее окружение относится к внешней среде и не зависит от конкретного предприятия."}, {"q": "Какая группа факторов оказывает наибольшее влияние на проекты согласно лекции?", "options": ["Экономика и законы/право", "Культура и общество", "Политика и общество", "Природа, экология и инфраструктура"], "answer": 0, "hint": "В лекции экономика и законы/право указаны как факторы с наибольшим влиянием."}, {"q": "Кто является участниками проекта?", "options": ["Только руководитель проекта", "Только инвестор и заказчик", "Физические и юридические лица, непосредственно участвующие в проекте или чьи интересы могут быть затронуты", "Только сотрудники организации"], "answer": 2, "hint": "В состав участников входят непосредственно вовлеченные лица и лица, чьи интересы могут быть затронуты."}, {"q": "Кто такой инициатор проекта?", "options": ["Работник, выявляющий потребность и предлагающий начать проект", "Только внешний инвестор", "Сотрудник, отвечающий только за закупки", "Конечный потребитель продукта"], "answer": 0, "hint": "Инициатор выявляет потребность и предлагает начать проект."}, {"q": "Кто такой руководитель проекта?", "options": ["Лицо, отвечающее за управление проектом и достижение целей в рамках бюджета, времени и качества", "Только финансовый контролер", "Только представитель заказчика", "Сотрудник, отвечающий исключительно за закупки"], "answer": 0, "hint": "Руководитель проекта отвечает за управление и достижение целей с учетом бюджета, времени и качества."}, {"q": "Какие фазы жизненного цикла проекта выделены в лекции?", "options": ["Инициация, разработка, реализация, завершение", "Планирование, закупки, аудит, ликвидация", "Проектирование, производство, продажа, реклама", "Финансирование, страхование, контроль, отчетность"], "answer": 0, "hint": "В лекции жизненный цикл состоит из инициации, разработки, реализации и завершения."}, {"q": "Что происходит на стадии инициации проекта?", "options": ["Только закрытие бюджета", "Формальное признание необходимости выполнить проект и уточнение основных параметров", "Только приемка готового продукта", "Только составление итогового отчета"], "answer": 1, "hint": "Инициация формально признает необходимость проекта; уточняются содержание, ресурсы, руководитель и ограничения."}, {"q": "Как чаще называется документ, соответствующий Project Charter, в российской практике согласно лекции?", "options": ["Концепция проекта", "Смета проекта", "Календарный план", "Сетевой график"], "answer": 0, "hint": "В лекции отмечено, что в российской практике этот документ чаще называют концепцией проекта."}, {"q": "Что такое предметная область проекта?", "options": ["Только перечень участников", "Совокупность продуктов и услуг, производство которых должно быть обеспечено в проекте; содержание проекта", "Только бюджет проекта", "Только внешние факторы проекта"], "answer": 1, "hint": "Лекция связывает предметную область с содержанием проекта и конечными результатами в виде товаров и услуг."}, {"q": "Что такое цель проекта?", "options": ["Описание результата, которого необходимо достичь в ходе проекта", "Перечень всех участников", "Только размер бюджета", "Только срок завершения"], "answer": 0, "hint": "Цель описывает требуемый результат, которого необходимо достичь."}, {"q": "Какова главная цель планирования проекта?", "options": ["Составить только список участников", "Построить модель реализации проекта для координации участников и определения порядка работ", "Только определить стоимость оборудования", "Только выбрать метод страхования"], "answer": 1, "hint": "Планирование строит модель реализации проекта для координации участников и определения порядка работ."}, {"q": "Какие инструменты календарного планирования перечислены в лекции?", "options": ["Только текстовый отчет", "Иерархическая структура работ, сетевые графики, диаграммы Ганта, ресурсные и финансовые гистограммы", "Только бухгалтерский баланс", "Только договоры с поставщиками"], "answer": 1, "hint": "В лекции перечислены эти инструменты календарного планирования."}, {"q": "Что такое сетевая модель проекта?", "options": ["График только финансовых платежей", "Логическая последовательность работ проекта", "Только перечень участников", "Только календарь совещаний"], "answer": 1, "hint": "Сетевая модель представляет логическую последовательность работ и связи между ними."}, {"q": "Что такое критический путь?", "options": ["Полный путь максимальной продолжительности от начального до конечного события", "Самый дешевый путь проекта", "Путь с максимальным количеством участников", "Любой путь с резервом времени"], "answer": 0, "hint": "Критический путь — полный путь максимальной продолжительности; его длина определяет общую длительность проекта."}, {"q": "Что такое резерв события в сетевой модели?", "options": ["Разность между поздним и ранним сроками наступления события", "Сумма всех затрат проекта", "Разность между бюджетом и фактическими затратами", "Количество участников события"], "answer": 0, "hint": "Резерв события равен позднему сроку минус ранний срок наступления."}, {"q": "Что такое веха проекта?", "options": ["Значимое контрольное событие или ключевой момент проекта", "Любая строка бюджета", "Любая задача длительностью более недели", "Только окончательная приемка проекта"], "answer": 0, "hint": "Вехи используются как значимые контрольные точки при планировании и отслеживании проекта."}, {"q": "Что такое дисконтирование?", "options": ["Учет изменения стоимости денежных потоков во времени при инвестиционном анализе", "Только распределение ресурсов между участниками", "Только расчет календарных сроков", "Только страхование рисков"], "answer": 0, "hint": "Дисконтирование учитывает временную стоимость денежных потоков при инвестиционном анализе."}, {"q": "Что такое бюджетируемые затраты?", "options": ["Реальный денежный отток, уже произошедший", "Оценочная стоимость работ, распределенная во времени", "Только обязательства по договорам", "Только непредвиденные расходы"], "answer": 1, "hint": "Бюджетируемые затраты — оценочная стоимость работ, распределенная во времени."}, {"q": "Что такое фактические затраты?", "options": ["Оценка будущей стоимости работ", "Реальный денежный отток", "Только резерв бюджета", "Только стоимость незавершенных работ"], "answer": 1, "hint": "Фактические затраты — реально осуществленный денежный отток."}, {"q": "Что такое управление рисками проекта?", "options": ["Методы анализа и нейтрализации факторов риска, встроенные в планирование, контроль и корректирующие действия", "Только страхование проекта", "Только составление списка угроз", "Только расчет прибыли проекта"], "answer": 0, "hint": "Лекция рассматривает управление рисками как выявление, анализ, выбор и применение мер реагирования и контроль."}, {"q": "Какой метод снижения риска связан с передачей определенных рисков страховой компании?", "options": ["Диверсификация", "Страхование", "Локализация", "Резервирование"], "answer": 1, "hint": "Страхование прямо описано в лекции как передача определенных рисков страховой компании."}, {"q": "Сколько процессов содержит процессная модель управления проектом, приведенная в лекции?", "options": ["39", "41", "42", "44"], "answer": 0, "hint": "В лекции указано: 1 процесс инициации, 21 планирования, 7 исполнения, 8 контроля и 2 завершения. Всего 39."}];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){shuffle(questions);questions.forEach(x=>{let a=x.options.map((t,i)=>({t,ok:i===x.answer}));shuffle(a);x.options=a.map(v=>v.t);x.answer=a.findIndex(v=>v.ok)});render()}
function render(){let q=document.getElementById('quiz');q.innerHTML='';questions.forEach((x,i)=>{let c=document.createElement('section');c.className='card';c.innerHTML='<h2>'+(i+1)+'. '+x.q+'</h2>';x.options.forEach((o,j)=>{let l=document.createElement('label');l.className='opt';l.innerHTML='<input type="radio" name="q'+i+'" value="'+j+'"> '+String.fromCharCode(1040+j)+') '+o;l.querySelector('input').onchange=()=>answer(i,j);c.appendChild(l)});let f=document.createElement('div');f.id='f'+i;f.className='feedback';c.appendChild(f);q.appendChild(c)})}
function answer(i,v){let x=questions[i],c=document.getElementById('quiz').children[i],opts=c.querySelectorAll('.opt'),f=document.getElementById('f'+i);opts.forEach((l,j)=>{l.querySelector('input').disabled=true;if(j===x.answer)l.classList.add('good');if(j===v&&j!==x.answer)l.classList.add('bad')});if(v===x.answer){f.className='feedback good';f.innerHTML='<b>✓ Правильно!</b><br>'+x.hint}else{f.className='feedback bad';f.innerHTML='<b>✗ Неправильно.</b><br><b>Правильный ответ:</b> '+x.options[x.answer]+'<br><b>Почему:</b> '+x.hint}update()}
function update(){let n=questions.reduce((s,_,i)=>s+(document.querySelector('input[name=q'+i+']:checked')?1:0),0);document.getElementById('fill').style.width=(n/29*100)+'%';document.getElementById('count').textContent='Отвечено: '+n+' из 29'}
document.getElementById('check').onclick=()=>{let s=0,details='';questions.forEach((x,i)=>{let a=document.querySelector('input[name=q'+i+']:checked');if(!a){details+='<div class="err"><b>'+(i+1)+'. Не отвечено</b><br>Правильный ответ: '+x.options[x.answer]+'</div>';return}if(+a.value===x.answer){s++;details+='<div class="ok">'+(i+1)+'. Верно ✓</div>'}else details+='<div class="err"><b>'+(i+1)+'. Ошибка ✗</b><br>Правильный ответ: '+x.options[x.answer]+'</div>'});let g=s>=27?'Отлично!':s>=23?'Хорошо!':s>=18?'Удовлетворительно':'Нужно повторить материал';let r=document.getElementById('result');r.style.display='block';r.innerHTML='<div class="score">'+s+' / 29</div><p><b>'+g+'</b></p>'+details;r.scrollIntoView({behavior:'smooth'})}
document.getElementById('restart').onclick=()=>{document.getElementById('result').style.display='none';start();window.scrollTo({top:0,behavior:'smooth'})}
start();
</script></body></html>
